services:
  blitz_compilation:
    build:
      context: .
      args:
        - COMPILE_ALL=${COMPILE_ALL:-false}
        - FOR_X=${FOR_X:-pi5}
    privileged: true
    environment:
      BLITZ_SOURCE_DIR: ${BLITZ_SOURCE_DIR:+/blitz-source}
      BLITZ_REF: ${BLITZ_REF:-HEAD}
      BLITZ_GIT_URL: ${BLITZ_GIT_URL:-https://github.com/PinewoodRobotics/B.L.I.T.Z.git}
      BLITZ_USER: ${BLITZ_USER:-ubuntu}
      BLITZ_PASSWORD: ${BLITZ_PASSWORD:-ubuntu}
      BLITZ_UID: ${BLITZ_UID:-1000}
      BLITZ_GID: ${BLITZ_GID:-1000}
    stdin_open: true
    volumes:
      - .:/host
      - ${BLITZ_SOURCE_DIR:-.}:/blitz-source:ro
    tty: true
    ports:
      - "6756:6756"
